<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Corin 專業日式無痛除毛</title>
    
    <meta name="description" content="Corin Beauty預約系統">
    <meta property="og:title" content="Corin Beauty預約系統">
    <meta property="og:description" content="Corin Beauty預約系統">
    <meta property="og:type" content="website">
    
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- 引入 LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    
    <!-- 引入 Flatpickr -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/airbnb.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/zh-tw.js"></script>
    
    <!-- 引入 SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- 引入 Vue.js -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Noto Sans TC"', 'sans-serif'] },
                    colors: {
                        brand: {
                            50: '#fdf8f6', 100: '#f2e8e5', 200: '#eaddd7', 300: '#e0cec7',
                            400: '#d2bab0', 500: '#c5a89c', 600: '#b09489', 700: '#9b8075',
                            800: '#866c62', 900: '#72584e',
                        },
                        admin: {
                            50: '#f0fdf4', 500: '#22c55e', 600: '#16a34a',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #fcfcfc;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        body::-webkit-scrollbar { display: none; }
        
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(197, 168, 156, 0.15);
        }

        .service-radio + label { transition: all 0.3s ease; }

        .loader {
            border-top-color: #c5a89c;
            animation: spinner 1.5s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        input, select, textarea { font-size: 16px !important; }
        [v-cloak] { display: none !important; }
        .step-enter-active, .step-leave-active { transition: all 0.4s ease; }
        .step-enter-from, .step-leave-to { opacity: 0; transform: translateY(-10px); max-height: 0; overflow: hidden; margin: 0; padding: 0; }
        .step-enter-to, .step-leave-from { opacity: 1; transform: translateY(1000px); max-height: 2000px; }
    </style>
</head>
<body class="text-gray-800 antialiased selection:bg-brand-200 selection:text-brand-900 bg-[#fcfcfc]">

  <div id="app" v-cloak class="min-h-screen flex flex-col">

    <template v-if="currentView === 'front'">
        <!-- 前台頭部 -->
        <header class="sticky top-0 z-50 glass-panel border-b border-gray-100">
            <div class="max-w-md mx-auto px-4 py-4 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-full bg-brand-500 flex items-center justify-center text-white shadow-md">
                        <i class="fa-solid fa-spa text-sm"></i>
                    </div>
                    <h1 class="text-lg font-bold text-gray-800 tracking-wider">Corin 專業日式無痛除毛</h1>
                </div>
                <button @click="goToAdminLogin" class="text-gray-300 hover:text-gray-400 focus:outline-none">
                    <i class="fa-solid fa-lock text-xs"></i>
                </button>
            </div>
        </header>

        <main class="flex-grow max-w-md mx-auto w-full px-4 py-6 pb-32">
            <div class="mb-6">
                <h2 class="text-2xl font-bold text-gray-800 mb-4">預約諮詢</h2>
                
                <div class="bg-red-50 border-l-4 border-red-400 p-4 rounded-r-xl shadow-sm mb-6">
                    <h3 class="text-red-800 font-bold mb-2 flex items-center gap-1"><i class="fa-solid fa-bullhorn"></i> 預約注意事項</h3>
                    <p class="text-sm text-red-700 font-bold mb-1">預約完成後請等待美容師回覆確認</p>
                    <p class="text-xs text-red-600 mb-3 leading-relaxed">※重要提醒：預約需提前2-3天才有辦法安排理想的時段，恕不接受當天預約操作，謝謝您的配合！</p>
                    
                    <h4 class="text-sm font-bold text-gray-800 mb-1">溫馨提醒 :</h4>
                    <ol class="text-xs text-gray-700 list-decimal pl-4 space-y-1.5">
                        <li>因無淋浴設備，麻煩預約私密處課程的您，先自行在家清潔完再前往店內。</li>
                        <li>工作室空間有限，盡量以不攜伴為主。</li>
                        <li>課程前一天請先將毛髮刮除，避免肌膚敏感，效果也最好。</li>
                        <li>預約完成請準時赴約，現場保留10分鐘，逾時視同取消，並列入黑名單。</li>
                        <li>為維護會員預約品質，二次預約不到或當月更改時間達二次，下次預約將酌收訂金$500。</li>
                    </ol>
                </div>
            </div>

            <form id="bookingForm" class="space-y-6" @submit.prevent="submitBooking">
                
                <!-- 步驟 1: 選擇美容師性別 -->
                <div id="step-therapist" class="space-y-3 bg-white p-5 rounded-2xl shadow-sm border border-brand-100">
                    <label class="block text-sm font-bold text-gray-800">1. 選擇指定美容師 <span class="text-red-400">*</span></label>
                    <div class="grid grid-cols-2 gap-3">
                        <div class="relative">
                            <input type="radio" name="therapist_gender" id="therapist_female" value="female" v-model="bookingForm.therapistGender" @change="scrollToNext('step-vip')" class="service-radio hidden" required>
                            <label for="therapist_female" :class="bookingForm.therapistGender === 'female' ? 'border-pink-300 bg-pink-50 text-pink-700 shadow-inner' : 'border-gray-100 hover:bg-gray-50 text-gray-500'" class="flex flex-col items-center justify-center p-4 border-2 rounded-xl cursor-pointer h-full transition-all">
                                <i class="fa-solid fa-person-dress text-3xl mb-2" :class="bookingForm.therapistGender === 'female' ? 'text-pink-500' : 'text-gray-300'"></i>
                                <span class="text-sm font-medium">女師</span>
                            </label>
                        </div>
                        <div class="relative">
                            <input type="radio" name="therapist_gender" id="therapist_male" value="male" v-model="bookingForm.therapistGender" @change="scrollToNext('step-vip')" class="service-radio hidden" required>
                            <label for="therapist_male" :class="bookingForm.therapistGender === 'male' ? 'border-blue-300 bg-blue-50 text-blue-700 shadow-inner' : 'border-gray-100 hover:bg-gray-50 text-gray-500'" class="flex flex-col items-center justify-center p-4 border-2 rounded-xl cursor-pointer h-full transition-all">
                                <i class="fa-solid fa-person text-3xl mb-2" :class="bookingForm.therapistGender === 'male' ? 'text-blue-500' : 'text-gray-300'"></i>
                                <span class="text-sm font-medium">男師</span>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- 步驟 2: 選擇 VIP 身份 -->
                <transition name="step">
                    <div id="step-vip" v-show="bookingForm.therapistGender" class="space-y-3 bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                        <label class="block text-sm font-bold text-gray-800">2. 是否為 VIP 會員 <span class="text-red-400">*</span></label>
                        <div class="grid grid-cols-2 gap-3">
                            <div class="relative">
                                <input type="radio" name="vip" id="vip_yes" :value="true" v-model="bookingForm.isVip" @change="scrollToNext('step-gender')" class="service-radio hidden" required>
                                <label for="vip_yes" :class="bookingForm.isVip === true ? 'border-amber-400 bg-amber-50 text-amber-700 shadow-inner' : 'border-gray-100 hover:bg-gray-50 text-gray-500'" class="flex flex-col items-center justify-center p-4 border-2 rounded-xl cursor-pointer h-full transition-all">
                                    <i class="fa-solid fa-crown text-3xl mb-2" :class="bookingForm.isVip === true ? 'text-amber-500' : 'text-gray-300'"></i>
                                    <span class="text-sm font-medium">我是 VIP</span>
                                </label>
                            </div>
                            <div class="relative">
                                <input type="radio" name="vip" id="vip_no" :value="false" v-model="bookingForm.isVip" @change="scrollToNext('step-gender')" class="service-radio hidden" required>
                                <label for="vip_no" :class="bookingForm.isVip === false ? 'border-gray-400 bg-gray-100 text-gray-700 shadow-inner' : 'border-gray-100 hover:bg-gray-50 text-gray-500'" class="flex flex-col items-center justify-center p-4 border-2 rounded-xl cursor-pointer h-full transition-all">
                                    <i class="fa-solid fa-user text-3xl mb-2" :class="bookingForm.isVip === false ? 'text-gray-500' : 'text-gray-300'"></i>
                                    <span class="text-sm font-medium">我不是 VIP</span>
                                </label>
                                <button type="button" @click.stop="showVipInfo = true" class="absolute top-2 right-2 w-7 h-7 rounded border border-gray-200 flex items-center justify-center bg-white text-gray-400 hover:text-brand-500 hover:border-brand-300 transition-colors shadow-sm">
                                    <i class="fa-solid fa-question text-xs"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </transition>

                <!-- 步驟 3: 選擇客戶性別 -->
                <transition name="step">
                    <div id="step-gender" v-show="bookingForm.isVip !== null" class="space-y-3 bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                        <label class="block text-sm font-bold text-gray-800">3. 請選擇您的性別 <span class="text-red-400">*</span></label>
                        <div class="grid grid-cols-2 gap-3">
                            <div class="relative">
                                <input type="radio" name="customer_gender" id="cust_female" value="female" v-model="bookingForm.customerGender" @change="scrollToNext('step-services')" class="service-radio hidden" required>
                                <label for="cust_female" :class="bookingForm.customerGender === 'female' ? 'border-pink-300 bg-pink-50 text-pink-700 shadow-inner' : 'border-gray-100 hover:bg-gray-50 text-gray-500'" class="flex flex-col items-center justify-center p-4 border-2 rounded-xl cursor-pointer h-full transition-all">
                                    <i class="fa-solid fa-venus text-3xl mb-2" :class="bookingForm.customerGender === 'female' ? 'text-pink-500' : 'text-gray-300'"></i>
                                    <span class="text-sm font-medium">我是女生</span>
                                </label>
                            </div>
                            <div class="relative">
                                <input type="radio" name="customer_gender" id="cust_male" value="male" v-model="bookingForm.customerGender" @change="scrollToNext('step-services')" class="service-radio hidden" required>
                                <label for="cust_male" :class="bookingForm.customerGender === 'male' ? 'border-blue-300 bg-blue-50 text-blue-700 shadow-inner' : 'border-gray-100 hover:bg-gray-50 text-gray-500'" class="flex flex-col items-center justify-center p-4 border-2 rounded-xl cursor-pointer h-full transition-all">
                                    <i class="fa-solid fa-mars text-3xl mb-2" :class="bookingForm.customerGender === 'male' ? 'text-blue-500' : 'text-gray-300'"></i>
                                    <span class="text-sm font-medium">我是男生</span>
                                </label>
                            </div>
                        </div>
                    </div>
                </transition>

                <!-- 步驟 4: 選擇服務項目 (可多選，取消平滑捲動以利多選操作) -->
                <transition name="step">
                    <div id="step-services" v-show="bookingForm.customerGender" class="space-y-3 bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                        <label class="block text-sm font-bold text-gray-800 mb-2">4. 選擇服務項目 (可多選) <span class="text-red-400">*</span></label>
                        
                        <div v-if="activeServices.length === 0" class="text-center py-4 bg-gray-50 rounded-xl text-gray-500 text-sm">
                            目前沒有符合您選擇的服務項目。
                        </div>

                        <div v-else class="grid grid-cols-2 gap-3">
                            <div v-for="service in activeServices" :key="service.id" class="relative">
                                <input type="checkbox" name="service" :id="'srv_' + service.id" :value="service.name" v-model="bookingForm.service" class="service-radio hidden">
                                <label :for="'srv_' + service.id" :class="bookingForm.service.includes(service.name) ? 'border-brand-400 bg-brand-50 text-brand-800 shadow-inner' : 'border-gray-200 hover:bg-gray-50'" class="flex flex-col items-center justify-center p-4 border rounded-xl cursor-pointer h-full transition-all">
                                    <i :class="[service.icon, bookingForm.service.includes(service.name) ? 'text-brand-500' : 'text-gray-400']" class="text-2xl mb-2"></i>
                                    <span class="text-sm font-medium text-center">{{ service.name }}</span>
                                    <div class="flex flex-col items-center mt-1">
                                        <span class="text-xs" :class="bookingForm.service.includes(service.name) ? 'text-brand-600' : 'text-gray-400'">{{ service.duration }} mins</span>
                                        <span class="text-sm font-bold mt-0.5" :class="bookingForm.service.includes(service.name) ? 'text-brand-700' : 'text-gray-700'">NT$ {{ bookingForm.isVip ? (service.vipPrice || service.price || 0) : (service.regularPrice || service.price || 0) }}</span>
                                    </div>
                                    <div v-if="bookingForm.service.includes(service.name)" class="absolute top-2 right-2 text-brand-500">
                                        <i class="fa-solid fa-circle-check"></i>
                                    </div>
                                </label>
                            </div>
                        </div>

                        <div v-if="bookingForm.service.length > 0" class="mt-4 p-4 bg-brand-50 rounded-xl border border-brand-200 shadow-sm transition-all">
                            <div class="flex justify-between items-center mb-2 border-b border-brand-200/50 pb-2">
                                <span class="text-sm font-bold text-gray-700">已選擇 {{ bookingForm.service.length }} 項服務</span>
                                <span class="text-sm text-gray-600 font-medium"><i class="fa-regular fa-clock"></i> 約 {{ estimatedDuration }} 分鐘</span>
                            </div>
                            <div class="flex justify-between items-end">
                                <span class="text-sm font-bold text-gray-700">預計消費金額</span>
                                <span class="text-xl font-bold text-brand-700">NT$ {{ estimatedTotal }}</span>
                            </div>
                            <p class="text-[10px] text-gray-500 mt-2 text-right">※ 實際消費金額以現場美容師核銷計算</p>
                        </div>
                    </div>
                </transition>

                <!-- 步驟 5: 選擇日期 -->
                <transition name="step">
                    <div id="step-date" v-show="bookingForm.service.length > 0" class="space-y-4 bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                        <label class="block text-sm font-bold text-gray-800 border-b pb-2">5. 選擇預約日期 <span class="text-red-400">*</span></label>
                        <div>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i class="fa-regular fa-calendar text-gray-400"></i>
                                </div>
                                <input type="text" id="date" v-model="bookingForm.date" class="block w-full pl-10 pr-3 py-3 border border-gray-200 rounded-lg focus:ring-brand-500 focus:border-brand-500 bg-gray-50 focus:bg-white transition-colors cursor-pointer" placeholder="請點擊選擇日期" readonly required>
                            </div>
                        </div>
                    </div>
                </transition>

                <!-- 步驟 6: 選擇時間 -->
                <transition name="step">
                    <div id="step-time" v-show="bookingForm.date" class="space-y-4 bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                        <div class="flex items-center justify-between border-b pb-2">
                            <label class="block text-sm font-bold text-gray-800">6. 選擇預約時段 <span class="text-red-400">*</span></label>
                        </div>
                        
                        <div v-if="availableSlots.length > 0" class="grid grid-cols-3 gap-2 mt-2">
                            <button
                                v-for="slot in availableSlots" :key="slot.time" type="button"
                                @click="slot.available && selectTime(slot.time)"
                                :disabled="!slot.available"
                                :class="[
                                    'py-2.5 px-2 rounded-lg text-sm font-medium transition-colors border',
                                    bookingForm.time === slot.time ? 'bg-brand-500 text-white border-brand-500 shadow-sm' :
                                    !slot.available ? 'bg-gray-50 text-gray-300 border-gray-100 cursor-not-allowed' :
                                    'bg-white text-gray-700 border-gray-200 hover:border-brand-300 hover:bg-brand-50'
                                ]"
                            >
                                {{ slot.time }}
                            </button>
                        </div>
                        <div v-else class="text-center py-6 bg-gray-50 rounded-xl text-gray-500 text-sm">
                            <i class="fa-regular fa-face-frown mb-2 text-xl block"></i>
                            該日已無可滿足此服務時間的空檔<br>或未在營業時間內
                        </div>
                    </div>
                </transition>

                <!-- 步驟 7: 會員驗證及聯絡資訊 -->
                <transition name="step">
                    <div id="step-phone" v-show="bookingForm.time" class="space-y-4 bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                        <h3 class="text-sm font-bold text-gray-800 border-b pb-2">7. 驗證會員以填寫資料 <span class="text-red-400">*</span></h3>
                        
                        <!-- 尚未驗證：輸入電話 -->
                        <div v-if="!bookingForm.isVerified">
                            <label for="verify-phone" class="block text-sm font-medium text-gray-700 mb-1">聯絡電話 <span class="text-red-400">*</span></label>
                            <div class="flex gap-2">
                                <input type="tel" id="verify-phone" v-model="bookingForm.phone" class="block w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-brand-500 focus:border-brand-500 bg-gray-50 focus:bg-white transition-colors" placeholder="請輸入手機號碼以比對資料" pattern="[0-9]{10}" required>
                                <button type="button" @click="verifyPhone" class="bg-gray-800 text-white px-5 rounded-lg font-bold hover:bg-gray-700 transition-colors whitespace-nowrap shadow-sm">驗證</button>
                            </div>
                        </div>

                        <!-- 驗證成功：顯示唯讀資料與備註欄 -->
                        <div v-if="bookingForm.isVerified" class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">姓名</label>
                                <input type="text" v-model="bookingForm.name" class="block w-full px-4 py-3 border border-gray-200 rounded-lg bg-gray-100 text-gray-500 cursor-not-allowed" readonly>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">聯絡電話</label>
                                <input type="tel" v-model="bookingForm.phone" class="block w-full px-4 py-3 border border-gray-200 rounded-lg bg-gray-100 text-gray-500 cursor-not-allowed" readonly>
                            </div>
                            <div v-if="bookingForm.birthday">
                                <label class="block text-sm font-medium text-gray-700 mb-1">生日</label>
                                <input type="text" v-model="bookingForm.birthday" class="block w-full px-4 py-3 border border-gray-200 rounded-lg bg-gray-100 text-gray-500 cursor-not-allowed" readonly>
                            </div>

                            <div>
                                <label for="notes" class="block text-sm font-medium text-gray-700 mb-1">顧客備註欄 (選填)</label>
                                <textarea id="notes" v-model="bookingForm.notes" rows="3" class="block w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-brand-500 focus:border-brand-500 bg-gray-50 focus:bg-white transition-colors resize-none" placeholder="是否有特殊需求？"></textarea>
                            </div>
                        </div>
                    </div>
                </transition>
                
                <button type="submit" ref="hiddenSubmitBtn" class="hidden"></button>
            </form>
            
            <div class="text-center text-xs text-gray-400 mt-10 mb-6">
                原點數位科技 © 2026 All rights reserved.
            </div>
        </main>

        <!-- 驗證成功後顯示的浮動送出按鈕 -->
        <transition name="step">
            <div v-show="bookingForm.isVerified" class="fixed bottom-0 left-0 right-0 p-4 glass-panel border-t border-gray-100 z-40 pb-safe">
                <div class="max-w-md mx-auto">
                    <button type="button" @click="triggerSubmit" class="w-full bg-brand-500 hover:bg-brand-600 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-brand-500/30 transition duration-300 flex items-center justify-center gap-2 transform active:scale-[0.98]">
                        <span>確認送出，前往 LINE</span>
                        <i class="fa-brands fa-line text-xl"></i>
                    </button>
                </div>
            </div>
        </transition>

        <!-- VIP 資訊 Modal -->
        <div v-if="showVipInfo" class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm transition-opacity" @click="showVipInfo = false">
            <div class="bg-white rounded-2xl p-6 max-w-xs w-full shadow-2xl relative animate-[bounce_0.3s_ease-out]" @click.stop>
                <button @click="showVipInfo = false" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 transition-colors">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
                <div class="flex items-start gap-4 mt-2">
                    <div class="w-10 h-10 rounded-full bg-amber-100 flex items-center justify-center flex-shrink-0 text-amber-500">
                        <i class="fa-solid fa-crown text-lg"></i>
                    </div>
                    <div>
                        <h4 class="font-bold text-gray-800 mb-1">VIP 專屬優惠</h4>
                        <p class="text-sm text-gray-600 leading-relaxed">VIP 享原價 8 折優惠及點數累積回饋，詳情請洽詢美容師。</p>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <div v-if="isLoading" class="fixed inset-0 bg-white/80 backdrop-blur-sm z-[150] flex flex-col items-center justify-center">
        <div class="loader ease-linear rounded-full border-4 border-t-4 h-12 w-12 mb-4" :class="currentView === 'admin' ? 'border-admin-200 border-t-admin-500' : 'border-gray-200 border-t-brand-500'"></div>

  </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const { createApp, ref, computed, onMounted, nextTick, watch } = Vue;

        createApp({
            setup() {
                const firebaseConfig = {
                    apiKey: "AIzaSyCe0KE7va2H4-A6XECdzhTUCjhTeT6FOJM",
                    authDomain: "check-balance-13da9.firebaseapp.com",
                    projectId: "check-balance-13da9",
                    storageBucket: "check-balance-13da9.firebasestorage.app",
                    messagingSenderId: "827416952029",
                    appId: "1:827416952029:web:e18ac89b984c8351e36f34",
                    measurementId: "G-J4KY08ECZR"
                };
                
                const appId = firebaseConfig.projectId; 
                let db = null;
                let auth = null;
                const isDbReady = ref(false);

                // --- 狀態管理 ---
                const currentView = ref('front'); 
                const adminTab = ref('calendar'); 
                const isLoading = ref(true); 
                
                const services = ref([]);
                const bookings = ref([]);
                const closedDatesMap = ref({}); 
                const admins = ref([]);

                const adminAccount = ref('');
                const adminPassword = ref('');
                const loginError = ref('');
                const isAdminAuthenticated = ref(false);
                const isSuperAdmin = ref(false);
                
                const showVipInfo = ref(false);
                const serviceSearch = ref('');
                const serviceFilterGender = ref('all');

                // --- 輔助函數 ---
                const timeToMins = (timeStr) => {
                    if(!timeStr) return 0;
                    const [h, m] = timeStr.split(':').map(Number);
                    return h * 60 + m;
                };
                const minsToTime = (mins) => {
                    const h = Math.floor(mins / 60).toString().padStart(2, '0');
                    const m = (mins % 60).toString().padStart(2, '0');
                    return `${h}:${m}`;
                };
                
                const scrollToNext = (id) => {
                    setTimeout(() => {
                        const el = document.getElementById(id);
                        if (el) {
                            const offset = 80;
                            const bodyRect = document.body.getBoundingClientRect().top;
                            const elementRect = el.getBoundingClientRect().top;
                            const elementPosition = elementRect - bodyRect;
                            const offsetPosition = elementPosition - offset;
                            window.scrollTo({ top: offsetPosition, behavior: 'smooth' });
                        }
                    }, 150);
                };

                // --- 初始化 Firebase 與 Auth ---
                const initFirebase = async () => {
                    try {
                        const app = initializeApp(firebaseConfig);
                        db = getFirestore(app);
                        auth = getAuth(app);
                        
                        onAuthStateChanged(auth, (user) => {
                            if (user) {
                                setupFirestoreListeners();
                                isDbReady.value = true;
                                isLoading.value = false;
                            } else {
                                signInAnonymously(auth).catch((error) => {
                                    console.error("Auth error:", error);
                                    Swal.fire('系統警告', '資料庫連線權限異常，部分功能可能無法使用。', 'warning');
                                    isLoading.value = false;
                                });
                            }
                        });

                    } catch(e) {
                        console.warn("Firebase Init Failed.", e);
                        isLoading.value = false;
                    }
                };

                const setupFirestoreListeners = () => {
                    if (!auth.currentUser || !db) return;

                    onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'services'), (snap) => {
                        let data = snap.docs.map(d => ({ id: d.id, sortOrder: 0, ...d.data() }));
                        data.sort((a, b) => {
                            const orderA = a.sortOrder || 0;
                            const orderB = b.sortOrder || 0;
                            if (orderA !== orderB) return orderA - orderB;
                            const priceA = Number(a.regularPrice || a.price || 0);
                            const priceB = Number(b.regularPrice || b.price || 0);
                            return priceB - priceA;
                        });
                        services.value = data;
                    }, (err) => console.error(err));

                    onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'bookings'), (snap) => {
                        let data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                        data.sort((a, b) => {
                            if(a.date !== b.date) return a.date.localeCompare(b.date);
                            return a.time.localeCompare(b.time);
                        });
                        bookings.value = data;
                    }, (err) => console.error(err));

                    onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'schedule'), (snap) => {
                        if (snap.exists()) closedDatesMap.value = snap.data().dates || {};
                        else closedDatesMap.value = {};
                    }, (err) => console.error(err));

                    onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'admins'), (snap) => {
                        admins.value = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    }, (err) => console.error(err));
                };

                const bookingForm = ref({ therapistGender: '', isVip: null, customerGender: '', service: [], date: '', time: '', phone: '', name: '', notes: '', isVerified: false, birthday: '' });
                
                const activeServices = computed(() => {
                    return services.value.filter(s => {
                        if (!s.isActive) return false;
                        if (!bookingForm.value.customerGender) return true;
                        return !s.genderTarget || s.genderTarget === 'all' || s.genderTarget === bookingForm.value.customerGender;
                    }).sort((a, b) => {
                        const orderA = a.sortOrder || 0;
                        const orderB = b.sortOrder || 0;
                        if (orderA !== orderB) return orderA - orderB;
                        const priceA = Number(a.regularPrice || a.price || 0);
                        const priceB = Number(b.regularPrice || b.price || 0);
                        return priceB - priceA;
                    });
                });

                const estimatedTotal = computed(() => {
                    if (!bookingForm.value.service.length) return 0;
                    return bookingForm.value.service.reduce((sum, name) => {
                        const s = services.value.find(service => service.name === name);
                        if (!s) return sum;
                        const price = bookingForm.value.isVip ? Number(s.vipPrice || s.price || 0) : Number(s.regularPrice || s.price || 0);
                        return sum + price;
                    }, 0);
                });

                const estimatedDuration = computed(() => {
                    if (!bookingForm.value.service.length) return 0;
                    return bookingForm.value.service.reduce((sum, name) => {
                        const s = services.value.find(service => service.name === name);
                        return sum + (s ? Number(s.duration) : 0);
                    }, 0);
                });
                
                const hiddenSubmitBtn = ref(null);
                let frontDatePicker = null;

                const getMinSelectableDate = () => new Date();

                const selectTime = (timeSlot) => {
                    bookingForm.value.time = timeSlot;
                    scrollToNext('step-phone');
                };

                const initFrontDatePicker = () => {
                    if (frontDatePicker) frontDatePicker.destroy();
                    const el = document.getElementById('date');
                    if (!el) return;

                    frontDatePicker = flatpickr(el, {
                        locale: "zh_tw",
                        minDate: getMinSelectableDate(),
                        disable: [
                            (date) => {
                                const dStr = flatpickr.formatDate(date, "Y-m-d");
                                return closedDatesMap.value[dStr]?.isClosed === true;
                            }
                        ],
                        dateFormat: "Y-m-d",
                        onChange: (selectedDates, dateStr) => {
                            bookingForm.value.date = dateStr;
                            bookingForm.value.time = ''; 
                            scrollToNext('step-time');
                        }
                    });
                };

                const availableSlots = computed(() => {
                    if (!bookingForm.value.date || bookingForm.value.service.length === 0 || !bookingForm.value.therapistGender) return [];
                    const duration = estimatedDuration.value;
                    const date = bookingForm.value.date;
                    const gender = bookingForm.value.therapistGender;
                    const dateSettings = closedDatesMap.value[date] || { isClosed: false, start: '12:00', end: '21:00' };
                    if (dateSettings.isClosed) return [];

                    const dayBookings = bookings.value.filter(b => b.date === date && b.therapistGender === gender && b.status !== 'cancelled');
                    const slots = [];
                    const startMin = timeToMins(dateSettings.start || '12:00');
                    const endMin = timeToMins(dateSettings.end || '21:00');
                    const stepMin = 30;

                    const now = new Date();
                    const isToday = (date === flatpickr.formatDate(now, "Y-m-d"));
                    const currentMins = now.getHours() * 60 + now.getMinutes();

                    for (let m = startMin; m < endMin; m += stepMin) {
                        const slotStart = m;
                        const slotEnd = m + duration;
                        let isAvailable = true;

                        if (isToday && slotStart <= currentMins + 30) isAvailable = false;
                        if (slotEnd > endMin) isAvailable = false;

                        if (isAvailable) {
                            for (const b of dayBookings) {
                                const bStart = timeToMins(b.time);
                                const bEnd = bStart + Number(b.duration);
                                if (slotStart < bEnd && slotEnd > bStart) {
                                    isAvailable = false;
                                    break;
                                }
                            }
                        }
                        slots.push({ time: minsToTime(m), available: isAvailable });
                    }
                    return slots;
                });

                watch(() => bookingForm.value.therapistGender, () => {
                    bookingForm.value.isVip = null;
                    bookingForm.value.customerGender = '';
                    bookingForm.value.service = [];
                    bookingForm.value.date = '';
                });
                watch(() => bookingForm.value.isVip, () => {
                    bookingForm.value.customerGender = '';
                    bookingForm.value.service = [];
                    bookingForm.value.date = '';
                });
                watch(() => bookingForm.value.customerGender, () => {
                    bookingForm.value.service = [];
                    bookingForm.value.date = '';
                });
                watch(() => bookingForm.value.service.length, (newLen, oldLen) => {
                    if (newLen > 0 && oldLen === 0) {
                        nextTick(() => { initFrontDatePicker(); });
                    }
                    bookingForm.value.time = '';
                });
                watch(() => bookingForm.value.date, () => {
                    bookingForm.value.time = '';
                });

                const triggerSubmit = () => { if (hiddenSubmitBtn.value) hiddenSubmitBtn.value.click(); };

                // --- 驗證電話號碼 ---
                const verifyPhone = async () => {
                    if (!bookingForm.value.phone || bookingForm.value.phone.length < 10) {
                        Swal.fire({ icon: 'error', title: '錯誤', text: '請輸入完整的10碼手機號碼。', confirmButtonColor: '#c5a89c' });
                        return;
                    }
                    
                    if (!isDbReady.value || !db || !auth.currentUser) {
                        Swal.fire({ icon: 'error', title: '系統錯誤', text: '資料庫尚未完成驗證，請重新整理網頁。', confirmButtonColor: '#c5a89c' });
                        return;
                    }

                    isLoading.value = true;
                    try {
                        let memberData = null;
                        
                        const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'beauty_members');
                        const q = query(colRef, where('phone', '==', bookingForm.value.phone));
                        const snap = await getDocs(q);

                        if (!snap.empty) { 
                            memberData = snap.docs[0].data(); 
                        }
                        
                        if (memberData) {
                            bookingForm.value.isVerified = true;
                            bookingForm.value.name = memberData.name || '';
                            bookingForm.value.birthday = memberData.birthday || '';
                            
                            Swal.fire({
                                icon: 'success',
                                title: '歡迎回來！',
                                text: '需待美容師回覆才算預約成功唷~請耐心等候！',
                                confirmButtonColor: '#c5a89c'
                            });
                            setTimeout(() => { window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }); }, 300);
                        } else {
                            Swal.fire({
                                icon: 'warning',
                                title: '查無會員資料',
                                text: '系統將在 2.5 秒後自動導向註冊頁面...',
                                showConfirmButton: false,
                                timer: 2500,
                                timerProgressBar: true
                            }).then(() => {
                                window.location.href = 'https://check-balance-jbiy.vercel.app/';
                            });
                        }
                    } catch(e) {
                        console.error("Verification error:", e);
                        Swal.fire({ icon: 'error', title: '系統錯誤', text: '驗證連線失敗，請稍後再試。', confirmButtonColor: '#c5a89c' });
                    } finally {
                        isLoading.value = false;
                    }
                };

                const submitBooking = async () => {
                    if (!bookingForm.value.isVerified) {
                        Swal.fire({ icon: 'warning', title: '提醒', text: '請先完成會員手機驗證', confirmButtonColor: '#c5a89c' });
                        return;
                    }
                
                    isLoading.value = true;
                    try {
                        const duration = estimatedDuration.value;
                        const price = estimatedTotal.value;
                        const serviceString = bookingForm.value.service.join(' + ');

                        if (isDbReady.value && db) {
                            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'bookings'), {
                                therapistGender: bookingForm.value.therapistGender,
                                isVip: bookingForm.value.isVip,
                                customerGender: bookingForm.value.customerGender, 
                                service: serviceString,
                                duration: duration,
                                date: bookingForm.value.date,
                                time: bookingForm.value.time,
                                status: 'pending',
                                name: bookingForm.value.name,
                                phone: bookingForm.value.phone,
                                birthday: bookingForm.value.birthday,
                                notes: bookingForm.value.notes,
                                createdAt: new Date().toISOString()
                            });
                        }

                        const tGenderText = bookingForm.value.therapistGender === 'male' ? '男師' : '女師';
                        const cGenderText = bookingForm.value.customerGender === 'male' ? '男生' : '女生';
                        const vipText = bookingForm.value.isVip ? '✅ 是 (享VIP價)' : '❌ 否 (原價)';
                        
                        const messageText = `✨【預約需求確認】✨\n\n` +
                                          `指定：${tGenderText}\n` +
                                          `客戶性別：${cGenderText}\n` +
                                          `VIP會員：${vipText}\n` +
                                          `姓名：${bookingForm.value.name}\n` +
                                          `電話：${bookingForm.value.phone}\n` +
                                          `生日：${bookingForm.value.birthday || '未提供'}\n` +
                                          `項目：${serviceString}\n` +
                                          `價格：NT$ ${price}\n` +
                                          `日期：${bookingForm.value.date}\n` +
                                          `時段：${bookingForm.value.time}\n` +
                                          `備註：${bookingForm.value.notes || '無'}\n\n` +
                                          `💡 請幫我確認此預約是否成立，謝謝！`;

                        const resetForm = () => {
                            bookingForm.value = { therapistGender: '', isVip: null, customerGender: '', service: [], date: '', time: '', phone: '', name: '', notes: '', isVerified: false, birthday: '' };
                        };

                        setTimeout(() => {
                            isLoading.value = false;
                            if (typeof liff !== 'undefined' && liff.isInClient()) {
                                liff.sendMessages([{ type: 'text', text: messageText }])
                                    .then(() => liff.closeWindow())
                                    .catch(err => {
                                        console.warn("LIFF 自動傳送失敗，啟用備用方案", err);
                                        window.location.href = `https://line.me/R/msg/text/?${encodeURIComponent(messageText)}`;
                                        resetForm();
                                    });
                            } else {
                                window.location.href = `https://line.me/R/msg/text/?${encodeURIComponent(messageText)}`;
                                resetForm();
                            }
                        }, 800);
                    } catch(e) {
                        console.error(e);
                        Swal.fire({ icon: 'error', title: '錯誤', text: '預約送出失敗，請稍後再試。', confirmButtonColor: '#c5a89c' });
                        isLoading.value = false;
                    }
                };

                const goToAdminLogin = () => {
                    currentView.value = 'admin_login';
                    window.location.hash = 'admin';
                };
                
                const verifyAdminLogin = () => {
                    isLoading.value = true;
                    loginError.value = '';
                    setTimeout(() => {
                        let authSuccess = false;
                        let isSuper = false;
                        
                        if (adminAccount.value === '信吉' && adminPassword.value === '7310168888') {
                            authSuccess = true;
                            isSuper = true;
                        } else {
                            const found = admins.value.find(a => a.account === adminAccount.value && a.password === adminPassword.value);
                            if (found) {
                                authSuccess = true;
                                if (found.account === '信吉') isSuper = true;
                            }
                        }
                        
                        if (authSuccess) {
                            isAdminAuthenticated.value = true;
                            isSuperAdmin.value = isSuper;
                            currentView.value = 'admin';
                            adminTab.value = 'calendar'; 
                            adminAccount.value = '';
                            adminPassword.value = '';
                        } else {
                            loginError.value = '帳號或密碼錯誤';
                        }
                        isLoading.value = false;
                    }, 500);
                };

                const logoutAdmin = () => {
                    isAdminAuthenticated.value = false;
                    isSuperAdmin.value = false;
                    currentView.value = 'front';
                    window.location.hash = '';
                };

                let adminCalendar = null;
                const isDateSettingModalOpen = ref(false);
                const editingDate = ref('');
                const dateSettingForm = ref({ isClosed: false, start: '12:00', end: '21:00' });

                const initAdminCalendar = () => {
                    const el = document.getElementById('admin-calendar-container');
                    if (!el) return;
                    if (adminCalendar) adminCalendar.destroy();

                    adminCalendar = flatpickr(el, {
                        inline: true, locale: "zh_tw", dateFormat: "Y-m-d",
                        onChange: (selectedDates, dateStr) => {
                            if (dateStr) {
                                editingDate.value = dateStr;
                                const existing = closedDatesMap.value[dateStr];
                                if (existing) {
                                    dateSettingForm.value = { ...existing };
                                } else {
                                    dateSettingForm.value = { isClosed: false, start: '12:00', end: '21:00' };
                                }
                                isDateSettingModalOpen.value = true;
                            }
                        }
                    });
                };
                
                const saveDateSetting = async () => {
                    if (!isDbReady.value) return;
                    const newDates = { ...closedDatesMap.value, [editingDate.value]: dateSettingForm.value };
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'schedule'), { dates: newDates });
                    isDateSettingModalOpen.value = false;
                    if (adminCalendar) adminCalendar.clear();
                };

                const removeDateSetting = async (date) => {
                    if (!isDbReady.value) return;
                    const newDates = { ...closedDatesMap.value };
                    delete newDates[date];
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'schedule'), { dates: newDates });
                };

                watch(adminTab, (newTab) => {
                    if (newTab === 'schedule') nextTick(() => { initAdminCalendar(); });
                });

                const calendarDate = ref(new Date());
                const currentYear = computed(() => calendarDate.value.getFullYear());
                const currentMonth = computed(() => calendarDate.value.getMonth());

                const monthlyStats = computed(() => {
                    const currentMonthStr = `${currentYear.value}-${String(currentMonth.value + 1).padStart(2, '0')}`;
                    const monthBookings = bookings.value.filter(b => b.date.startsWith(currentMonthStr));
                    return {
                        total: monthBookings.length,
                        pending: monthBookings.filter(b => b.status === 'pending' || !b.status).length,
                        completed: monthBookings.filter(b => b.status === 'completed').length,
                        cancelled: monthBookings.filter(b => b.status === 'cancelled').length
                    };
                });

                const calendarDays = computed(() => {
                    const year = currentYear.value;
                    const month = currentMonth.value;
                    const firstDay = new Date(year, month, 1).getDay(); 
                    const daysInMonth = new Date(year, month + 1, 0).getDate();
                    
                    const days = [];
                    const todayStr = flatpickr.formatDate(new Date(), "Y-m-d");

                    for (let i = 0; i < firstDay; i++) {
                        days.push({ date: '', isCurrentMonth: false });
                    }
                    for (let i = 1; i <= daysInMonth; i++) {
                        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                        const dayBookings = bookings.value.filter(b => b.date === dateStr);
                        
                        days.push({ 
                            date: i, fullDate: dateStr, isCurrentMonth: true, isToday: dateStr === todayStr,
                            bookings: dayBookings,
                            hasCustomSchedule: !!closedDatesMap.value[dateStr]
                        });
                    }
                    const totalCells = days.length;
                    const remainingCells = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
                    for (let i = 0; i < remainingCells; i++) {
                        days.push({ date: '', isCurrentMonth: false });
                    }
                    return days;
                });

                const prevMonth = () => { calendarDate.value = new Date(currentYear.value, currentMonth.value - 1, 1); };
                const nextMonth = () => { calendarDate.value = new Date(currentYear.value, currentMonth.value + 1, 1); };
                const goToToday = () => { calendarDate.value = new Date(); };

                const isBookingModalOpen = ref(false);
                const editBookingForm = ref({});
                
                const getBookingColorClass = (b) => {
                    if (b.status === 'cancelled') return 'bg-gray-100 text-gray-400 border border-gray-200 opacity-60';
                    if (b.status === 'completed') return 'bg-green-100 text-green-700 border border-green-200';
                    return b.therapistGender === 'female' ? 'bg-pink-100 text-pink-700 border border-pink-200' : 'bg-blue-100 text-blue-700 border border-blue-200';
                };

                const updateBookingStatus = async (b) => {
                    if (!isDbReady.value) return;
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'bookings', b.id), { status: b.status });
                };

                const openEditBookingModal = (b) => {
                    editBookingForm.value = { ...b };
                    isBookingModalOpen.value = true;
                };
                const closeBookingModal = () => isBookingModalOpen.value = false;
                
                const saveBookingEdit = async () => {
                    if (!isDbReady.value) return;
                    try {
                        const bRef = doc(db, 'artifacts', appId, 'public', 'data', 'bookings', editBookingForm.value.id);
                        await updateDoc(bRef, {
                            date: editBookingForm.value.date,
                            time: editBookingForm.value.time,
                            duration: Number(editBookingForm.value.duration),
                            notes: editBookingForm.value.notes || '' 
                        });
                        closeBookingModal();
                        Swal.fire({ icon: 'success', title: '成功', text: '預約時間及備註已更新', confirmButtonColor: '#16a34a' });
                    } catch(e) { 
                        Swal.fire({ icon: 'error', title: '錯誤', text: '更新失敗', confirmButtonColor: '#16a34a' });
                    }
                };

                const deleteBooking = (id) => {
                    Swal.fire({
                        title: '確認刪除',
                        text: "確定要刪除這筆紀錄嗎？",
                        icon: 'warning',
                        showCancelButton: true,
                        confirmButtonColor: '#d33',
                        cancelButtonColor: '#6b7280',
                        confirmButtonText: '確定刪除',
                        cancelButtonText: '取消'
                    }).then(async (result) => {
                        if (result.isConfirmed) {
                            if(isDbReady.value) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'bookings', id));
                        }
                    });
                };

                // 複製通知功能 (依照 iFrame 限制使用 document.execCommand)
                const copyNotification = (b) => {
                    let msg = '';
                    if (b.status === 'completed') {
                        msg = `🎉 【預約成功通知】 🎉\n\n親愛的 ${b.name} 您好：\n您的預約已確認成功！\n\n📌 預約日期：${b.date}\n⏰ 預約時間：${b.time}\n🌸 服務項目：${b.service}\n\n期待您的光臨！如果有任何問題，請隨時與我們聯絡。\nCorin 專業日式無痛除毛 敬上`;
                    } else if (b.status === 'cancelled') {
                        msg = `⚠️ 【預約取消通知】 ⚠️\n\n親愛的 ${b.name} 您好：\n您於 ${b.date} ${b.time} 的預約已為您取消。\n\n若有需要重新預約，歡迎隨時與我們聯絡！\nCorin 專業日式無痛除毛 敬上`;
                    } else {
                        msg = `⏳ 【預約待確認】 ⏳\n\n親愛的 ${b.name} 您好：\n您於 ${b.date} ${b.time} 的預約我們已經收到，目前正在為您安排時段，請稍候美容師的回覆確認，謝謝！\nCorin 專業日式無痛除毛 敬上`;
                    }

                    const textArea = document.createElement("textarea");
                    textArea.value = msg;
                    // 防止畫面跳動與閃爍
                    textArea.style.position = "fixed";
                    textArea.style.top = "0";
                    textArea.style.left = "0";
                    textArea.style.opacity = "0";
                    document.body.appendChild(textArea);
                    textArea.focus();
                    textArea.select();
                    
                    try {
                        const successful = document.execCommand('copy');
                        if(successful) {
                            Swal.fire({
                                title: '複製成功！',
                                text: '已將通知訊息複製到剪貼簿，請直接至 LINE 貼上傳送給客人。',
                                icon: 'success',
                                timer: 2000,
                                showConfirmButton: false
                            });
                        } else {
                            throw new Error("Copy failed");
                        }
                    } catch (err) {
                        Swal.fire({ icon: 'error', title: '複製失敗', text: '您的瀏覽器不支援自動複製，請手動輸入通知。', confirmButtonColor: '#16a34a' });
                    }
                    document.body.removeChild(textArea);
                };

                const filteredServices = computed(() => {
                    return services.value.filter(s => {
                        const matchSearch = s.name.toLowerCase().includes(serviceSearch.value.toLowerCase());
                        const matchGender = serviceFilterGender.value === 'all' || s.genderTarget === serviceFilterGender.value;
                        return matchSearch && matchGender;
                    }).sort((a, b) => {
                        const orderA = a.sortOrder || 0;
                        const orderB = b.sortOrder || 0;
                        if (orderA !== orderB) return orderA - orderB;
                        const priceA = Number(a.regularPrice || a.price || 0);
                        const priceB = Number(b.regularPrice || b.price || 0);
                        return priceB - priceA;
                    });
                });

                const updateServiceOrder = async (service) => {
                    if (!isDbReady.value) return;
                    try {
                        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'services', service.id), { sortOrder: Number(service.sortOrder) || 0 });
                    } catch(e) {
                        console.error(e);
                    }
                };

                const isServiceModalOpen = ref(false);
                const editingService = ref(null);
                const formService = ref({ name: '', duration: 60, regularPrice: 0, vipPrice: 0, icon: 'fa-solid fa-leaf', isActive: true, genderTarget: 'all', sortOrder: 0 });
                const availableIcons = [
                    'fa-solid fa-leaf', 'fa-solid fa-person-dress', 'fa-solid fa-person', 'fa-solid fa-hand-sparkles',
                    'fa-solid fa-droplet', 'fa-solid fa-scissors', 'fa-solid fa-heart', 'fa-solid fa-star',
                    'fa-solid fa-face-smile', 'fa-solid fa-spa'
                ];

                const openServiceModal = (service = null) => {
                    editingService.value = service;
                    formService.value = service ? { ...service, regularPrice: service.regularPrice || service.price || 0, vipPrice: service.vipPrice || service.price || 0, sortOrder: service.sortOrder || 0 } : { name: '', duration: 60, regularPrice: 0, vipPrice: 0, icon: 'fa-solid fa-leaf', isActive: true, genderTarget: 'all', sortOrder: 0 };
                    isServiceModalOpen.value = true;
                };
                const copyService = (service) => {
                    editingService.value = null;
                    formService.value = { ...service, name: service.name + ' (複製)', id: undefined, regularPrice: service.regularPrice || service.price || 0, vipPrice: service.vipPrice || service.price || 0, sortOrder: service.sortOrder || 0 };
                    isServiceModalOpen.value = true;
                };
                const closeServiceModal = () => isServiceModalOpen.value = false;

                const saveServiceData = async () => {
                    if(!isDbReady.value) return;
                    try {
                        const payload = { ...formService.value, duration: Number(formService.value.duration), regularPrice: Number(formService.value.regularPrice || 0), vipPrice: Number(formService.value.vipPrice || 0), sortOrder: Number(formService.value.sortOrder || 0), genderTarget: formService.value.genderTarget || 'all' };
                        delete payload.price; 
                        
                        if (editingService.value && editingService.value.id) {
                            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'services', editingService.value.id), payload);
                        } else {
                            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'services'), payload);
                        }
                        closeServiceModal();
                    } catch(e) { console.error(e); }
                };

                const toggleServiceStatus = async (service) => {
                    if(isDbReady.value) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'services', service.id), { isActive: service.isActive });
                };

                const deleteService = (id) => {
                    Swal.fire({
                        title: '確認刪除',
                        text: "確定要刪除這個服務品項嗎？",
                        icon: 'warning',
                        showCancelButton: true,
                        confirmButtonColor: '#d33',
                        cancelButtonColor: '#6b7280',
                        confirmButtonText: '確定刪除',
                        cancelButtonText: '取消'
                    }).then(async (result) => {
                        if (result.isConfirmed) {
                            if(isDbReady.value) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'services', id));
                        }
                    });
                };

                const importDefaultServices = async () => {
                    if (!isDbReady.value) return;
                    Swal.fire({
                        title: '確認匯入',
                        text: '即將自動為您匯入小部位、中部位、大部位及私密處預設品項（共 46 項）。確定要匯入嗎？',
                        icon: 'warning',
                        showCancelButton: true,
                        confirmButtonColor: '#16a34a',
                        cancelButtonColor: '#6b7280',
                        confirmButtonText: '確定匯入',
                        cancelButtonText: '取消'
                    }).then(async (result) => {
                        if (result.isConfirmed) {
                            isLoading.value = true;
                            try {
                                const defaults = [
                                    ...['腋下','唇周','乳暈','後頸','下巴','肚臍','膝蓋','指頭','鬢角'].map(n => ({name: n, duration: 20, regularPrice: 399, vipPrice: 320, genderTarget: 'female', icon: 'fa-solid fa-leaf', isActive: true})),
                                    ...['腋下','唇周','乳暈','後頸','下巴','肚臍','膝蓋','指頭','鬢角'].map(n => ({name: n, duration: 20, regularPrice: 599, vipPrice: 480, genderTarget: 'male', icon: 'fa-solid fa-leaf', isActive: true})),
                                    ...['上手','下手','全臉','上腹','下腹','上背','下背','落腮鬍'].map(n => ({name: n, duration: 30, regularPrice: 699, vipPrice: 560, genderTarget: 'female', icon: 'fa-solid fa-droplet', isActive: true})),
                                    ...['上手','下手','全臉','上腹','下腹','上背','下背','落腮鬍'].map(n => ({name: n, duration: 30, regularPrice: 899, vipPrice: 720, genderTarget: 'male', icon: 'fa-solid fa-droplet', isActive: true})),
                                    ...['大腿','小腿','臀部'].map(n => ({name: n, duration: 40, regularPrice: 899, vipPrice: 720, genderTarget: 'female', icon: 'fa-solid fa-hand-sparkles', isActive: true})),
                                    ...['大腿','小腿','臀部'].map(n => ({name: n, duration: 40, regularPrice: 1099, vipPrice: 880, genderTarget: 'male', icon: 'fa-solid fa-hand-sparkles', isActive: true})),
                                    {name: 'V / I / O (單部位)', duration: 30, regularPrice: 699, vipPrice: 560, genderTarget: 'female', icon: 'fa-solid fa-heart', isActive: true},
                                    {name: 'V + I', duration: 40, regularPrice: 1299, vipPrice: 1040, genderTarget: 'female', icon: 'fa-solid fa-heart', isActive: true},
                                    {name: 'V + I + O', duration: 50, regularPrice: 1799, vipPrice: 1440, genderTarget: 'female', icon: 'fa-solid fa-heart', isActive: true},
                                    {name: 'V / I / O (單部位)', duration: 30, regularPrice: 899, vipPrice: 720, genderTarget: 'male', icon: 'fa-solid fa-heart', isActive: true},
                                    {name: 'V + I', duration: 40, regularPrice: 1799, vipPrice: 1440, genderTarget: 'male', icon: 'fa-solid fa-heart', isActive: true},
                                    {name: 'V + I + O', duration: 60, regularPrice: 2599, vipPrice: 2080, genderTarget: 'male', icon: 'fa-solid fa-heart', isActive: true},
                                ];
                                const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'services');
                                for (let i = 0; i < defaults.length; i++) {
                                    await addDoc(colRef, { ...defaults[i], sortOrder: 0 });
                                }
                                Swal.fire({ icon: 'success', title: '成功', text: '預設品項已全部匯入完畢！', confirmButtonColor: '#16a34a' });
                            } catch(e) {
                                Swal.fire({ icon: 'error', title: '錯誤', text: '匯入失敗', confirmButtonColor: '#16a34a' });
                            }
                            isLoading.value = false;
                        }
                    });
                };

                const formAdmin = ref({ account: '', password: '' });
                const saveAdminUser = async () => {
                    if (!isDbReady.value) return;
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'admins'), formAdmin.value);
                    formAdmin.value = { account: '', password: '' };
                    Swal.fire({ icon: 'success', title: '成功', text: '已新增管理員帳號', confirmButtonColor: '#16a34a' });
                };

                const deleteAdminUser = (id) => {
                    Swal.fire({
                        title: '確認刪除',
                        text: "確定要移除此管理員權限嗎？",
                        icon: 'warning',
                        showCancelButton: true,
                        confirmButtonColor: '#d33',
                        cancelButtonColor: '#6b7280',
                        confirmButtonText: '確定刪除',
                        cancelButtonText: '取消'
                    }).then(async (result) => {
                        if (result.isConfirmed) {
                            if(isDbReady.value) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'admins', id));
                        }
                    });
                };

                onMounted(() => {
                    initFirebase();

                    if (typeof liff !== 'undefined') {
                        liff.init({ 
                            liffId: "2010909434-eVswjkpc"
                        }).then(() => {
                            console.log("LIFF 初始化成功");
                        }).catch((err) => {
                            console.error("LIFF 初始化失敗", err);
                        });
                    }

                    window.addEventListener('hashchange', () => {
                        currentView.value = (window.location.hash === '#admin' && !isAdminAuthenticated.value) ? 'admin_login' : (window.location.hash === '#admin' ? 'admin' : 'front');
                    });
                    if (window.location.hash === '#admin') currentView.value = 'admin_login';
                });

                return {
                    currentView, adminTab, isLoading, services, activeServices, bookings, closedDatesMap, admins, isSuperAdmin,
                    adminAccount, adminPassword, loginError, goToAdminLogin, verifyAdminLogin, logoutAdmin,
                    bookingForm, availableSlots, hiddenSubmitBtn, triggerSubmit, submitBooking,
                    estimatedTotal, estimatedDuration, showVipInfo, serviceSearch, serviceFilterGender, filteredServices, updateServiceOrder,
                    isBookingModalOpen, editBookingForm, openEditBookingModal, closeBookingModal, saveBookingEdit, deleteBooking, getBookingColorClass, updateBookingStatus, copyNotification,
                    isServiceModalOpen, editingService, formService, availableIcons,
                    openServiceModal, copyService, closeServiceModal, saveServiceData, toggleServiceStatus, deleteService, importDefaultServices,
                    isDateSettingModalOpen, editingDate, dateSettingForm, saveDateSetting, removeDateSetting,
                    formAdmin, saveAdminUser, deleteAdminUser,
                    calendarDate, currentYear, currentMonth, calendarDays, prevMonth, nextMonth, goToToday, monthlyStats,
                    verifyPhone, scrollToNext, selectTime
                };
            }
        }).mount('#app');

        document.documentElement.style.setProperty('--sat', 'env(safe-area-inset-top)');
        document.documentElement.style.setProperty('--sab', 'env(safe-area-inset-bottom)');
    </script>
</body>
</html>
